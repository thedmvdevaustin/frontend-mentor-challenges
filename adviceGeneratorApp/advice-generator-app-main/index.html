<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css" />
  <title>Frontend Mentor | Advice generator app</title>
</head>
<body>
  <main class="advice">
    <h1 class="advice__title">
      Advice #117
    </h1>
    <p class="advice__details">
      "It is easy to sit up and take notice, what's difficult is getting up and taking action."
    </p>
    <picture class="advice__picture">
      <source srcset="./images/pattern-divider-desktop.svg" media="(min-width: 720px)" class="advice__picture-desktop" />
      <img src="./images/pattern-divider-mobile.svg" alt="" class="advice__picture-mobile">
    </picture>
    <button type="button" class="advice__btn" aria-label="next advice message">
      <img src="./images/icon-dice.svg" alt="" width="24" height="24" aria-hidden="true" class="advice__btn-icon" />
    </button>
  </main>
  <script src="./script.js"></script>
</body>
</html>
